name: Android CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Rust core (.so) for Android
        run: bash rust/build-rust.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Jacoco coverage report + gate
        # 门禁阈值与基线见 app/build.gradle jacocoCoverageVerification（棘轮：只升不降）
        run: ./gradlew jacocoTestReport jacocoCoverageVerification

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: app/build/reports/jacoco/jacocoTestReport/

      - name: Build APK (debug)
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  rust-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust compilation
        run: cd rust/einkreader-core && cargo check

      - name: Run Rust tests
        run: cd rust/einkreader-core && cargo test

      - name: Audit dependencies for known vulnerabilities
        # cargo-audit（官方 rustsec action，自动安装并拉取 RUSTSEC 顾问库）
        # 检查 Cargo.lock 锁定版本中的已知 CVE/弃用 crate
        uses: rustsec/audit-action@v4
        with:
          working-directory: rust/einkreader-core
          token: ${{ secrets.GITHUB_TOKEN }}
