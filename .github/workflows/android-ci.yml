name: Android CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Rust core (.so) for Android
        run: bash rust/build-rust.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK (debug)
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  rust-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust compilation
        run: cd rust/einkreader-core && cargo check

      - name: Run Rust tests
        run: cd rust/einkreader-core && cargo test
