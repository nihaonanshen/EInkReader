plugins {
    id "com.android.application"
}

android {
    namespace "com.einkreader"
    compileSdk 35

    defaultConfig {
        applicationId "com.einkreader"
        minSdk 19
        targetSdk 35
        versionCode 4
        versionName "0.0.4"
        
        // Rust feature flag: Debug=true, Release=false (可在 gradle.properties 中覆盖)
        def enableRust = project.hasProperty('enableRust') ? project.enableRust.toBoolean() : false
        buildConfigField "boolean", "ENABLE_RUST", enableRust ? "true" : "false"
    }

    signingConfigs {
        release {
            // ★ 签名信息从 local.properties 读取（不提交到版本控制）
            def props = new Properties()
            def propFile = rootProject.file('local.properties')
            if (propFile.exists()) {
                props.load(new FileInputStream(propFile))
            }
            storeFile file(props.getProperty('storeFile', 'einkreader.jks'))
            storePassword props.getProperty('storePassword', '')
            keyAlias props.getProperty('keyAlias', 'einkreader')
            keyPassword props.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    bundle {
        language {
            enableSplit = true
        }
    }

    compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    
        buildFeatures {
            buildConfig true
        }
    }