plugins {
    id "org.jetbrains.kotlin.android"
    id "dagger.hilt.android.plugin" version "2.48"
    kotlin("kapt") version "1.9.20"
    id "com.android.application"
    id "jacoco"
}

android {
    namespace "com.einkreader"
    compileSdk 35

    defaultConfig {
        applicationId "com.einkreader"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "0.0.5"

        def enableRust = project.hasProperty('enableRust') ? project.enableRust.toBoolean() : false
        buildConfigField "boolean", "ENABLE_RUST", enableRust ? "true" : "false"
    }

    signingConfigs {
        release {
            storeFile file("einkreader.jks")
            storePassword "einkreader123"
            keyAlias "einkreader"
            keyPassword "einkreader123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            testCoverageEnabled true
        }
    }

    bundle {
        language {
            enableSplit = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                testLogging {
                    events "passed", "skipped", "failed", "standardOut"
                    showExceptions true
                    showStackTraces true
                }
            }
        }
    }
}

jacoco {
    toolVersion = "0.8.11"
}

dependencies {
    implementation "com.google.di:hilt-android:2.48"
    kapt "com.google.di:hilt-compiler:2.48"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.robolectric:robolectric:4.11"
    testImplementation "com.google.truth:truth:1.1.5"
    testImplementation "androidx.test:core:1.5.0"

    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}