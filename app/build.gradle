plugins {
    id "org.jetbrains.kotlin.android" version "1.9.20"
    id "com.android.application"
    id "jacoco"
}

android {
    namespace "com.einkreader"
    compileSdk 35

    defaultConfig {
        applicationId "com.einkreader"
        minSdk 19
        targetSdk 35
        versionCode 8
        versionName "0.0.7"
        
        // ✅ [Phase 6] Android 4.4 核心库反编译要求启用 Multidex
        multiDexEnabled true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        def enableRust = project.hasProperty('enableRust') ? project.enableRust.toBoolean() : false
        buildConfigField "boolean", "ENABLE_RUST", enableRust ? "true" : "false"
    }

    signingConfigs {
        release {
            // 签名配置：优先读 local.properties（本地构建），其次环境变量（CI）
            def props = new Properties()
            def propFile = rootProject.file("local.properties")
            if (propFile.exists()) {
                propFile.withInputStream { props.load(it) }
            }
            def storeFileVal = props['SIGNING_STORE_FILE'] ?: System.getenv("SIGNING_STORE_FILE") ?: "einkreader.jks"
            def storePassVal = props['SIGNING_STORE_PASSWORD'] ?: System.getenv("SIGNING_STORE_PASSWORD") ?: ""
            def keyPassVal = props['SIGNING_KEY_PASSWORD'] ?: System.getenv("SIGNING_KEY_PASSWORD") ?: ""
            // keystore 位于项目根目录（storeFile 相对路径基于模块目录，需显式用根目录）
            storeFile rootProject.file(storeFileVal)
            storePassword storePassVal
            keyAlias "einkreader"
            keyPassword keyPassVal
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            testCoverageEnabled true
        }
    }

    bundle {
        language {
            enableSplit = true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                testLogging {
                    events "passed", "skipped", "failed", "standardOut"
                    showExceptions true
                    showStackTraces true
                }
            }
        }
    }
}

jacoco {
    toolVersion = "0.8.11"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
    // ✅ [Phase 6] Android 4.4 多 dex 支持（EInkReaderApp 继承 MultiDexApplication）
    implementation "androidx.multidex:multidex:2.0.1"
    // ✅ [Phase 6] Android 4.4 Java 8+ 核心库反编译支持（Lambda, Stream API等）
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
    
    // Kotlin 协程
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.robolectric:robolectric:4.11"
    testImplementation "com.google.truth:truth:1.1.5"
    testImplementation "androidx.test:core:1.5.0"

    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}