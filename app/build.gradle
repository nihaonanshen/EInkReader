plugins {
    id "com.android.application"
}

android {
    namespace "com.einkreader"
    compileSdk 35

    defaultConfig {
        applicationId "com.einkreader"
        minSdk 19
        targetSdk 35
        versionCode 3
        versionName "0.0.3"
        
        // Rust feature flag: Debug=true, Release=false (可在 gradle.properties 中覆盖)
        def enableRust = project.hasProperty('enableRust') ? project.enableRust.toBoolean() : false
        buildConfigField "boolean", "ENABLE_RUST", enableRust ? "true" : "false"
    }

    signingConfigs {
        release {
            storeFile file("einkreader.jks")
            storePassword "einkreader123"
            keyAlias "einkreader"
            keyPassword "einkreader123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    bundle {
        language {
            enableSplit = true
        }
    }

    compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    
        buildFeatures {
            buildConfig true
        }
    }