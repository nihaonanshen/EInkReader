[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\link.exe"

# Android NDK 交叉编译
# 注意：Android 4.4 (API 19) 设备要求：
#   1) 链接目标必须 ≤ 设备 API（armv7 用 android19，见下方 rustflags）
#   2) NDK r20b（含 android-19 平台库）或使用 dl_stub.o 兜底 dl_iterate_phdr
#   推荐直接运行 build-rust.ps1（Windows）/ build-rust.sh（类 Unix）
# 设置环境变量 ANDROID_NDK_HOME 或使用下面的默认路径
# 构建命令：cargo build --target <target> --release

[target.aarch64-linux-android]
linker = "clang.exe"
rustflags = ["-Clink-arg=--target=aarch64-linux-android21"]

[target.armv7-linux-androideabi]
linker = "clang.exe"
# API 19（Android 4.4 设备）兼容：链接目标必须 ≤ 设备 API，
# 否则会引用 dl_iterate_phdr 等 API 21+ 才导出的符号，导致 dlopen 失败
rustflags = ["-Clink-arg=--target=armv7a-linux-androideabi19"]

[target.x86_64-linux-android]
linker = "clang.exe"
rustflags = ["-Clink-arg=--target=x86_64-linux-android21"]
